name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.ref_type == 'branch'
    concurrency:
      group: production-cloudflare-pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: data/scripts/requirements-fg03.txt

      - name: Install web dependencies
        run: npm ci

      - name: Install FG03 data dependencies
        run: python -m pip install -r data/scripts/requirements-fg03.txt

      - name: Test FG03 data pipeline
        env:
          PYTHONPATH: data/scripts
        run: >-
          python -m unittest discover
          -s data/scripts/tests
          -p 'test_fg03*.py'
          -v

      - name: Test web logic
        run: npm run test:web

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Build
        run: npm run build

      - name: Test built site contract
        run: npm run test:web:contract

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=toronto-micro-atlas --branch=main
