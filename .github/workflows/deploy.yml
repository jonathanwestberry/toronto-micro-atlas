name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.12.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            data/scripts/requirements-fg03.txt
            data/scripts/requirements-fg04.txt

      - name: Install web dependencies
        run: npm ci

      - name: Install data pipeline dependencies
        run: >-
          python -m pip install
          -r data/scripts/requirements-fg03.txt
          -r data/scripts/requirements-fg04.txt

      - name: Test data pipelines
        env:
          PYTHONPATH: data/scripts
        run: >-
          python -m unittest discover
          -s data/scripts/tests
          -p 'test_fg0*.py'
          -v

      - name: Test web logic
        run: npm run test:web

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Build
        run: npm run build

      - name: Test built site contract
        run: npm run test:web:contract

      - name: Prove FG04 renders visible selected-hour pixels
        run: npm run verify:fg04-explorer

      - name: Verify FG04 release candidate
        run: npm run verify:fg04-release

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=toronto-micro-atlas --branch=main
